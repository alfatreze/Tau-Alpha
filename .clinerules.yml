## 3. Core Project & Safety Guidelines
- **Git Context:** Always preserve the existing Git repository tracking configurations (`origin` and `upstream`). Never touch or break the repository tracking connections.
- **Robust Syntax:** Ensure all input variables and external api payloads are explicitly wrapped in robust error-handling/try-catch structures.
- **RAM Protection:** Keep individual file inspection payloads compact. Never overwhelm the token boundaries of your 16k context window buffer to protect the 24GB host Mac from out-of-memory kernel lockups.

name: Attach release zip

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The core will not start without its firmware image, and *.rom is
      # gitignored by default here -- so check it actually made it into the
      # checkout rather than publishing a zip that silently cannot boot.
      - name: Verify the release payload is complete
        run: |
          for f in \
            dist/Cores/alfatreze.TAU/bitstream.rbf_r \
            dist/Cores/alfatreze.TAU/core.json \
            dist/Cores/alfatreze.TAU/icon.bin \
            dist/Assets/tau/common/tau.rom \
            dist/Assets/tau/common/tau-loading.bin \
            dist/Platforms/tau.json \
            dist/Platforms/_images/tau.bin
          do
            if [ ! -s "$f" ]; then
              echo "::error::missing or empty: $f"
              exit 1
            fi
          done

      - name: Determine release archive name
        id: archive
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          release_date="$(python3 -c 'import json; print(json.load(open("dist/Cores/alfatreze.TAU/core.json"))["core"]["metadata"]["date_release"])')"
          archive="alfatreze.TAU_${version}_${release_date}.zip"
          echo "name=$archive" >> "$GITHUB_OUTPUT"

      - name: Create zip of dist contents
        run: |
          cd dist
          zip -r "../${{ steps.archive.outputs.name }}" . -x '*.DS_Store'

      - name: Upload zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.archive.outputs.name }}

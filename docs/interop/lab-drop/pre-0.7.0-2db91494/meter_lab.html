<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Tau meter lab</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#14181e;--mut:#5f6774;--line:#d0d4da}
@media (prefers-color-scheme:dark){:root{--bg:#14161a;--fg:#e8eaee;--mut:#98a0ad;--line:#2a2f37}}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif;padding:16px}
h1{font-size:18px;margin:0 0 12px}
.wrap{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
canvas{image-rendering:pixelated;border:1px solid var(--line);width:calc(400px * var(--z,1));max-width:100%}
.panel{min-width:260px}.panel label{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0}
.rgb{display:inline-flex;gap:6px;align-items:center;flex:1}.rgb input[type=text]{font:12px ui-monospace,monospace;width:7em}
.info{width:18px;height:18px;padding:0;border-radius:50%;border:1px solid var(--mut);background:none;color:var(--mut);font:italic 700 11px/16px Georgia,serif;cursor:pointer}.info:hover,.info:focus-visible{color:var(--fg);border-color:var(--fg)}
.stage{flex:0 0 auto;box-sizing:content-box;width:calc(400px * var(--z,1));max-width:calc(100vw - 24px);position:sticky;top:0;z-index:20;align-self:flex-start;max-height:100vh;overflow:auto;background:var(--bg);padding:8px 8px 6px 0;box-shadow:0 6px 10px -8px rgba(0,0,0,.4)}
@media (max-width:899px){.stage{position:static;max-height:none;box-shadow:none}}   /* stacked layout: the preview would fill the window, so it scrolls with the page */.infod{margin-top:6px;max-width:100%}#costtable table{border-collapse:collapse;font-size:11px;margin-top:6px;width:100%}#costtable th{text-align:left;font-weight:600;padding:2px 6px 2px 0;vertical-align:top;white-space:nowrap}#costtable td{padding:2px 6px;border-left:1px solid var(--line);vertical-align:top;color:var(--mut)}#costtable td.sel{color:var(--fg);font-weight:600}.infod .cost{overflow-wrap:anywhere;white-space:normal}.infod summary{cursor:pointer;color:var(--mut)}
.strip{position:relative;width:calc(400px * var(--z,1));max-width:100%;margin-top:2px}.strip canvas{display:block;width:100%;border:1px solid var(--line);border-bottom:0}
.hbar{position:relative;height:40px;border:1px solid var(--line);border-top:2px solid var(--line)}
.beads{position:absolute;left:0;right:0;top:0;pointer-events:none}.bead{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--c,#888);border:2px solid var(--bg);outline:1px solid var(--fg);cursor:ns-resize;pointer-events:auto;touch-action:none}
.handle{position:absolute;top:-2px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;background:none;border:0;padding:0;cursor:ew-resize;touch-action:none;color:var(--fg);font:11px system-ui,sans-serif}
.handle .tri{width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:11px solid var(--c)}
.handle .lbl{margin-top:1px;background:var(--bg);border:1px solid var(--c);padding:1px 6px;border-radius:9px;white-space:nowrap}
.handle:focus-visible .lbl,.handle.drag .lbl{outline:2px solid var(--fg)}
#tip{position:fixed;z-index:50;max-width:340px;background:var(--bg);color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:12px;line-height:1.4;box-shadow:0 4px 16px rgba(0,0,0,.25);pointer-events:none}
#tip div{margin:2px 0}#tip .tiph{color:var(--fg);margin-bottom:4px}#tip .sel{color:var(--fg);font-weight:600}
details.grp{border-top:1px solid var(--line);margin-top:8px;padding-top:2px}.grp summary{cursor:pointer;font-weight:600;padding:4px 0}.grpbody{padding-left:2px}
.panel select,.panel input[type=range]{flex:1}.val{min-width:70px;color:var(--mut);font-variant-numeric:tabular-nums}
.cost{margin-top:12px;color:var(--mut)}.over{color:#c4221b;font-weight:600}
#cv{max-width:none}   /* never scaled by the window: a fractional scale of the pixelated canvas makes uneven bars and black slits (Tau Omega 014 F-4); .stage scrolls instead */
body.embed{background:transparent;padding:0;overflow:hidden}body.embed h1,body.embed .panel,body.embed .infod,body.embed #controls,body.embed #splitwrap{display:none}   /* embed mode (contract 1): the embedder owns the meter and its parameters */
body.embed .wrap{display:block}body.embed .stage{position:static;padding:0;width:auto;max-width:none;max-height:none;overflow:visible;background:transparent;box-shadow:none}body.embed #cv{border:0;display:block;object-fit:none}
</style></head><body>
<h1>Tau meter lab <span class="val" id="tag"></span></h1>
<div class="wrap">
 <div class="stage"><canvas id="cv" width="400" height="360"></canvas><div id="splitwrap" hidden><div class="strip" id="strip"><canvas id="map" width="400" height="56"></canvas><div class="beads" id="beads"></div><div class="hbar" id="hbar"></div></div></div><details class="infod" id="infod"><summary>Info: commands, CPU, cost of each option</summary><div class="cost" id="cost"></div><div id="costtable"></div><div class="cost" id="splitnote"></div></details></div>
 <div class="panel">
  <label>Meter <select id="meter"></select></label>
  <label>Theme <select id="theme"></select></label>
  <label>Mode <select id="mode"><option value="0">Dark</option><option value="1">Light</option></select></label>
  <label>Accent <select id="accent"></select></label>
  <label>Source <select id="src"><option value="demo">Demo (deterministic)</option><option value="sweep">Sweep</option><option value="silence">Silence</option><option value="trace">Recorded trace (load file)</option><option value="file">Audio file (live)</option><option value="mic">Microphone (live)</option></select></label>
  <label>Audio file <input type="file" id="audiofile" accept="audio/*"></label>
  <label>Repeat audio file <input type="checkbox" id="repeat" checked></label>
  <label>Fullscreen figure (400×323) <input type="checkbox" id="fullfig"></label>
  <label>Preview size <select id="zoom"><option value="1" selected>1× (400 px, the real size)</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label>
  <label>Trace file <input type="file" id="tracefile" accept=".json"></label>
  <label>Bars use OP_BAR <input type="checkbox" id="barready" checked></label>
  <label title="LAYERED WAVE: the cost guard counts modelled CPU time (75 us per engine command) like the Pocket, not commands; the cell width it picks is shown in the info line">CPU-time guard (model) <input type="checkbox" id="timedg"></label>
  <label title="SOUND MAP: what the hardware statistics block would report (RMS and L/R correlation); off = a bitstream without it">stats block <input type="checkbox" id="statsok" checked></label> <label>correlation <input type="range" id="corr" min="-256" max="256" value="120"></label>
  <div id="controls"></div>
 </div>
</div>

layers","label":"Layers","type":"u8","min":1,"max":6,"step":1,"default":3,"help":"How many nested waves are drawn, from 1 to 6. More layers cost one drawing command per layer per column run.","group":"general"},{"key":"split","label":"Layer split","type":"enum","values":["OCTAVES","BASS_FINE","ENERGY","DYNAMICS","CUSTOM"],"default":0,"help":"What each layer listens to.","value_help":["OCTAVES: equal groups of the 16 spectrum bands.","BASS_FINE: bass gets the finest layers, treble one wide layer.","ENERGY: boundaries adapt so every layer carries about the same energy, whatever the track.","DYNAMICS: no frequency split; every layer follows the overall peak with its own time constant (the echo look).","CUSTOM: you place the boundaries. In the lab drag the handles under the meter (double-click the strip to add a layer, double-click a handle to remove one); on the Pocket use the Split 1-5 settings."],"group":"source"},{"key":"outer","label":"Outer layer","type":"enum","values":["BASS","TREBLE"],"default":0,"help":"Which end of the spectrum is the big outer wave: BASS or TREBLE.","group":"source"},{"key":"nest","label":"Layer mode","type":"enum","values":["NESTED","OVERLAP"],"default":0,"help":"NESTED: each layer also hears everything inside it, so inner waves can never poke out of outer ones. OVERLAP: each layer hears only its own frequencies and layers may cross.","group":"source"},{"key":"xo1","label":"Split 1","type":"u8","min":1,"max":15,"step":1,"default":3,"when":{"split":4},"group":"source","help":"Band boundary (1-15) between layer 1 and layer 2, counted in half-octave bands from the bass end (band 1 = about 133 Hz). Only used by the CUSTOM split, and only while Layers is greater than 1. In the lab, drag the handles under the meter instead."},{"key":"xo2","label":"Split 2","type":"u8","min":1,"max":15,"step":1,"default":5,"when":{"split":4},"group":"source","help":"Band boundary (1-15) between layer 2 and layer 3, counted in half-octave bands from the bass end (band 1 = about 133 Hz). Only used by the CUSTOM split, and only while Layers is greater than 2. In the lab, drag the handles under the meter instead."},{"key":"xo3","label":"Split 3","type":"u8","min":1,"max":15,"step":1,"default":8,"when":{"split":4},"group":"source","help":"Band boundary (1-15) between layer 3 and layer 4, counted in half-octave bands from the bass end (band 1 = about 133 Hz). Only used by the CUSTOM split, and only while Layers is greater than 3. In the lab, drag the handles under the meter instead."},{"key":"xo4","label":"Split 4","type":"u8","min":1,"max":15,"step":1,"default":11,"when":{"split":4},"group":"source","help":"Band boundary (1-15) between layer 4 and layer 5, counted in half-octave bands from the bass end (band 1 = about 133 Hz). Only used by the CUSTOM split, and only while Layers is greater than 4. In the lab, drag the handles under the meter instead."},{"key":"xo5","label":"Split 5","type":"u8","min":1,"max":15,"step":1,"default":13,"when":{"split":4},"group":"source","help":"Band boundary (1-15) between layer 5 and layer 6, counted in half-octave bands from the bass end (band 1 = about 133 Hz). Only used by the CUSTOM split, and only while Layers is greater than 5. In the lab, drag the handles under the meter instead."},{"key":"draw","label":"Draw","type":"enum","values":["BLOCKS","SMOOTH"],"default":1,"help":"How the picture is built each frame.","value_help":["BLOCKS: flat chunky columns, redrawn only when a new column arrives.","SMOOTH: a curved outline evaluated across the width with sub-column motion; the best look. Both modes self-scale: if a frame needs more than about 300 drawing commands the meter widens its drawing cells (coarser, never slower)."],"group":"display"},{"key":"res","label":"Resolution","type":"u16","min":16,"max":400,"step":8,"default":200,"unit":"cols","help":"Resolution: how many columns span the width, up to 400 (one per pixel). In HISTORY view it is the number of history columns; in SPECTRUM view the spectrum has only 16 hardware bands, so it sets how finely the interpolated outline is drawn (lower = chunkier and cheaper). The meter widens its drawing cells automatically if the setting would need too many commands.","group":"display"},{"key":"speed","label":"Scroll speed","type":"u8","min":20,"max":240,"step":10,"default":100,"unit":"px/s","help":"How fast the wave scrolls, in pixels per second. HISTORY view only.","when":{"view":0},"group":"dynamics"},{"key":"response","label":"Response","type":"u8","min":1,"max":100,"step":5,"default":45,"help":"How quickly layers follow the music. Low = slow, lingering; high = snappy. Attack is always about 4 times faster than release.","group":"dynamics"},{"key":"taper","label":"Tail taper","type":"u8","min":0,"max":100,"step":5,"default":70,"unit":"%","help":"Roll-off toward the tail: the wave narrows (its colour no longer fades) and ends in three dots. 0 = full height to the edge. In SPECTRUM view both ends are pointed. The Taper curve sets the profile of the narrowing.","group":"display"},{"key":"color_mode","label":"Colour source","type":"enum","values":["ACCENT","THEME","CUSTOM"],"default":1,"help":"Where the layer colours come from.","value_help":["ACCENT: derived from your accent colour, with the gradation chosen below. Follows the accent, theme and Dark/Light.","THEME: pick theme colours (roles) for outer layer, inner layer and background. Follows the theme and Dark/Light.","CUSTOM: your own colours, entered as hex in Omega or the lab (colour picker) and stored in the Pocket's 16-bit format."],"group":"display"},{"key":"grad","label":"Accent gradation","type":"enum","values":["TINTS","SHADES","ANALOGOUS","COMPLEMENT"],"default":0,"when":{"color_mode":0},"help":"How the layers step away from the accent, outer to inner (ACCENT source only). The background is a dark tint of the accent.","value_help":["TINTS: outer = accent, inner layers lighten toward white.","SHADES: inner = accent, outer layers darken.","ANALOGOUS: neighbouring hues, 30 degrees either side of the accent (pink to violet from a pink accent).","COMPLEMENT: outer = accent, inner = the opposite hue."],"group":"display"},{"key":"color_outer","label":"Outer colour","type":"enum","values":["ACCENT","TEXT","TEXT2","OK","WARN","DANGER","PILL","ERROR","SURFACE","TRACK","BASE","BG"],"default":5,"help":"Theme role for the outermost layer. Colours are roles, not RGB, so they follow the theme, your accent and Dark/Light.","when":{"color_mode":1},"group":"display"},{"key":"color_inner","label":"Inner colour","type":"enum","values":["ACCENT","TEXT","TEXT2","OK","WARN","DANGER","PILL","ERROR","SURFACE","TRACK","BASE","BG"],"default":0,"help":"Theme role for the innermost layer; layers in between blend from outer to inner.","when":{"color_mode":1},"group":"display"},{"key":"color_bg","label":"Background","type":"enum","values":["ACCENT","TEXT","TEXT2","OK","WARN","DANGER","PILL","ERROR","SURFACE","TRACK","BASE","BG"],"default":10,"help":"Theme role for the solid background of the meter box (one fill command).","when":{"color_mode":1},"group":"display"},{"key":"custom_outer","label":"Custom outer","type":"u16","min":0,"max":65535,"step":1,"default":57905,"kind":"rgb565","when":{"color_mode":2},"help":"RGB565 colour for the outer layer (CUSTOM source only). In the lab use the picker or type hex; it is converted to the Pocket's 16-bit format (the swatch shows the quantised result).","group":"display"},{"key":"custom_inner","label":"Custom inner","type":"u16","min":0,"max":65535,"step":1,"default":41662,"kind":"rgb565","when":{"color_mode":2},"help":"RGB565 colour for the inner layer (CUSTOM source only). In the lab use the picker or type hex; it is converted to the Pocket's 16-bit format (the swatch shows the quantised result).","group":"display"},{"key":"custom_bg","label":"Custom background","type":"u16","min":0,"max":65535,"step":1,"default":6277,"kind":"rgb565","when":{"color_mode":2},"help":"RGB565 colour for the background box (CUSTOM source only). In the lab use the picker or type hex; it is converted to the Pocket's 16-bit format (the swatch shows the quantised result).","group":"display"},{"key":"taper_curve","label":"Taper curve","type":"enum","values":["NORMAL","SHORT","SHORTER","SHARP"],"default":0,"help":"The profile of the tail taper: how the wave narrows towards the tail. Applies when Tail taper is above 0.","value_help":["NORMAL: the original roll-off; a thin sliver trails out to the edge.","SHORT: the faintest fifth of the tail is cut, so the wave ends a little sooner.","SHORTER: the faintest third is cut: a clearly shorter tail.","SHARP: the roll-off is squared: the wave narrows faster and its tail stays thin."],"group":"display"},{"key":"direction","label":"Direction","type":"enum","values":["RIGHT","LEFT"],"default":0,"help":"Which way the picture flows (HISTORY and SCROLL). The head (the pointed start, Head length) is where the newest sound enters and the tail (Tail length, the three dots in HISTORY) is where it leaves, so the two swap sides with the direction.","value_help":["RIGHT: the newest sample enters at the left and the wave flows right: head on the left, tail on the right (the original).","LEFT: the exact mirror: the newest enters at the right and the wave flows left: head on the right, tail and its dots on the left."],"group":"display"},{"key":"taper_head","label":"Head length","type":"u8","min":0,"max":50,"step":1,"default":0,"unit":"%","help":"How much of the width the pointed head takes to rise to full height. HISTORY only: SCROLL moves what was already drawn, so the wave enters at full height. 0 = the original, very short ramp.","group":"display"},{"key":"taper_tail","label":"Tail length","type":"u8","min":10,"max":100,"step":5,"default":100,"unit":"%","help":"How much of the remaining width the tail takes to narrow to nothing (HISTORY and SCROLL). 100 = the original, which narrows all the way across; lower values keep full height longer and taper over the last part only.","group":"display"},{"key":"hstyle","label":"Spectrum style","type":"enum","values":["BLOCKS","EQ BELLS","CURVE"],"default":0,"when":{"view":1},"help":"How the layers share the frequency axis in SPECTRUM view (experimental).","value_help":["BLOCKS: hard blocks, each layer draws only its own frequency range.","EQ BELLS: the same ranges with soft shoulders that taper into the neighbours, like the bell curves of a parametric EQ.","CURVE: one continuous gradient-coloured outline across the whole axis; the layer colours become colour stops and the layer gains a smooth gain curve."],"group":"experimental","experimental":true},{"key":"aa","label":"Antialiasing","type":"enum","values":["OFF","EDGE 2","EDGE 4","EDGE 8"],"default":0,"help":"Soften the stair-steps along each layer edge with partly covered pixels (experimental, software). The number is how many coverage levels are used: more levels look smoother but merge less, so they need more drawing commands (see the Info cost table in the lab).","value_help":["OFF: whole pixels only.","EDGE 2: one extra pixel row per edge, half or no coverage.","EDGE 4: four coverage levels.","EDGE 8: eight levels, the smoothest and the most commands."],"group":"experimental","experimental":true},{"key":"bmode","label":"Layer blending","type":"enum","values":["OFF","ALPHA","AVERAGE","ADD","SUBTRACT","ADD QUARTER"],"default":0,"help":"Composite the layers with the blend modes of the drawing engine's blend unit, computed in software on the colours the CPU already knows (experimental). Each layer is blended over the one outside it, so layers are clamped to nest. Costs no extra drawing commands.","value_help":["OFF: opaque layers.","ALPHA: ordinary translucency, 0-255 alpha.","AVERAGE: half of each, B/2 + F/2.","ADD: layer added to what is underneath, clamped (glow, light on dark).","SUBTRACT: layer subtracted from what is underneath, clamped to black.","ADD QUARTER: a quarter of the layer added, clamped (a faint glow)."],"group":"experimental","experimental":true},{"key":"balpha","label":"Blend alpha","type":"u8","min":5,"max":100,"step":5,"default":60,"unit":"%","when":{"bmode":1},"help":"Opacity of each layer in ALPHA blending.","group":"experimental","experimental":true},{"key":"guard","label":"Cost guard","type":"enum","values":["ON","RELAXED","OFF"],"default":0,"help":"The self-scaling guard keeps a picture inside a time budget by widening the drawing cells (on the Pocket it counts CPU time; the host simulation counts commands).","value_help":["ON: budget about 9 ms of CPU per picture. With several layers at high Resolution the cells are widened, so edges and the taper step at that width; they narrow again only after a calm stretch, so the width does not flicker.","RELAXED: budget about 18 ms; finer cells, about twice the drawing work (a full-screen picture may then exceed the meter's command ceiling and be drawn only every other time).","OFF: never widen; the full Resolution you asked for, at whatever it costs (measured: about 18 ms a picture full-screen, choppy, and it can starve the audio loop)."],"group":"experimental","experimental":true},{"key":"g1","label":"Gain, layer 1","type":"u8","min":0,"max":36,"step":1,"default":18,"offset":-18,"unit":"dB","help":"Gain of layer 1 in dB, -18 to +18 (experimental). In the lab also set by dragging the bead on the frequency strip up or down; double-click the bead to reset. The stored number is the dB plus 18.","group":"experimental","experimental":true},{"key":"g2","label":"Gain, layer 2","type":"u8","min":0,"max":36,"step":1,"default":18,"offset":-18,"unit":"dB","help":"Gain of layer 2 in dB, -18 to +18 (experimental). In the lab also set by dragging the bead on the frequency strip up or down; double-click the bead to reset. The stored number is the dB plus 18.","group":"experimental","experimental":true},{"key":"g3","label":"Gain, layer 3","type":"u8","min":0,"max":36,"step":1,"default":18,"offset":-18,"unit":"dB","help":"Gain of layer 3 in dB, -18 to +18 (experimental). In the lab also set by dragging the bead on the frequency strip up or down; double-click the bead to reset. The stored number is the dB plus 18.","group":"experimental","experimental":true},{"key":"g4","label":"Gain, layer 4","type":"u8","min":0,"max":36,"step":1,"default":18,"offset":-18,"unit":"dB","help":"Gain of layer 4 in dB, -18 to +18 (experimental). In the lab also set by dragging the bead on the frequency strip up or down; double-click the bead to reset. The stored number is the dB plus 18.","group":"experimental","experimental":true},{"key":"g5","label":"Gain, layer 5","type":"u8","min":0,"max":36,"step":1,"default":18,"offset":-18,"unit":"dB","help":"Gain of layer 5 in dB, -18 to +18 (experimental). In the lab also set by dragging the bead on the frequency strip up or down; double-click the bead to reset. The stored number is the dB plus 18.","group":"experimental","experimental":true},{"key":"g6","label":"Gain, layer 6","type":"u8","min":0,"max":36,"step":1,"default":18,"offset":-18,"unit":"dB","help":"Gain of layer 6 in dB, -18 to +18 (experimental). In the lab also set by dragging the bead on the frequency strip up or down; double-click the bead to reset. The stored number is the dB plus 18.","group":"experimental","experimental":true}],"presets":[{"name":"AURORA","values":{"view":0,"layers":3,"split":0,"outer":0,"nest":0,"xo1":3,"xo2":5,"xo3":8,"xo4":11,"xo5":13,"draw":1,"res":200,"speed":100,"response":45,"taper":70,"color_mode":1,"grad":0,"color_outer":5,"color_inner":0,"color_bg":10,"custom_outer":57905,"custom_inner":41662,"custom_bg":6277,"hstyle":0,"aa":0,"bmode":0,"balpha":60,"guard":0,"g1":18,"g2":18,"g3":18,"g4":18,"g5":18,"g6":18,"taper_curve":0,"direction":0,"taper_head":0,"taper_tail":100}},{"name":"SUNSET","values":{"view":0,"layers":5,"split":1,"outer":0,"nest":0,"xo1":3,"xo2":5,"xo3":8,"xo4":11,"xo5":13,"draw":1,"res":160,"speed":130,"response":50,"taper":55,"color_mode":0,"grad":1,"color_outer":5,"color_    for(let i=1;i<n;i++){const h=document.createElement('button');h.type='button';h.className='handle';h.setAttribute('aria-label','Layer boundary '+i+' (arrow keys move it)');h.innerHTML='<span class="tri"></span><span class="lbl"></span>';
    h.onpointerdown=e=>{e.preventDefault();h.setPointerCapture(e.pointerId);drag=i;h.classList.add('drag');};
    h.onpointermove=e=>{if(drag===i)moveTo(i,bandAt(e.clientX));};
    h.onpointerup=h.onpointercancel=()=>{drag=-1;h.classList.remove('drag');};
    h.ondblclick=e=>{e.stopPropagation();const l=bandsNow().slice(1,-1);l.splice(i-1,1);setBounds(l);};
    h.onkeydown=e=>{const d=e.key==='ArrowLeft'?-1:e.key==='ArrowRight'?1:0;if(d){e.preventDefault();moveTo(i,bandsNow()[i]+d);}};
    hbar.appendChild(h);handles.push(h);}
  }
  const b=bandsNow();
  handles.forEach((h,k)=>{const i=k+1,layer=params.outer===0?i-1:n-i;h.style.left=(b[i]/16*100)+'%';h.style.setProperty('--c',col[layer]||'#888');h.querySelector('.lbl').textContent=hz(b[i]);h.title='Boundary between layers '+i+' and '+(i+1)+' at about '+hz(b[i])+'Hz';});
 }
 const beads=$('beads');let beadEls=[];
 function layoutBeads(col){   // one bead per layer: drag up/down to set that layer's gain (dB), double-click to reset; the line through them is the gain curve
  if(!mod||!mod.boundsFor||params.layers===undefined){beads.innerHTML='';beadEls=[];return;}
  const n=params.layers,b=bandsNow();beads.style.height=($('map').clientHeight||56)+'px';
  if(beadEls.length!==n){beads.innerHTML='';beadEls=[];
   for(let k=0;k<n;k++){const e=document.createElement('div');e.className='bead';e.setAttribute('role','slider');e.setAttribute('aria-label','Gain, layer '+(k+1));
    e.onpointerdown=ev=>{ev.preventDefault();e.setPointerCapture(ev.pointerId);e._d=true;};
    e.onpointermove=ev=>{if(!e._d)return;const r=$('map').getBoundingClientRect(),g=Math.max(-18,Math.min(18,Math.round((0.5-(ev.clientY-r.top)/r.height)*36)));if(g+18!==(params['g'+(k+1)]|0))ctl.set('g'+(k+1),g+18);};
    e.onpointerup=e.onpointercancel=()=>{e._d=false;};e.ondblclick=()=>ctl.set('g'+(k+1),0);
    beads.appendChild(e);beadEls.push(e);}}
  beadEls.forEach((e,k)=>{const g=params.outer===0?k:n-1-k,cx=params.split===3?(k+0.5)/n:(b[g]+b[g+1])/2/16,gain=(params['g'+(k+1)]|0)-18;
   e.style.left=(cx*100)+'%';e.style.top=((0.5-gain/36)*100)+'%';e.style.setProperty('--c',col[k]||'#888');e.title='Layer '+(k+1)+' gain '+(gain>0?'+':'')+gain+' dB (drag up or down, double-click resets)';});
 }
 function splitMap(){const w=$('splitwrap');if(!mod||!mod.describe){w.hidden=true;return;}w.hidden=false;
  const c=$('map').getContext('2d'),d=mod.describe(params,st),own=mod.bandOwner(params,st),col=mod.layerColours(theme,params).map(v=>{const[r,g,b]=TauFb.from565(v);return 'rgb('+r+','+g+','+b+')'});
  c.clearRect(0,0,400,56);for(let k=0;k<16;k++){const v=lvl[k]/255,h=Math.round(v*46);c.fillStyle=col[own[k]]||'#888';c.fillRect(k*25+2,48-h,21,h);c.fillStyle='rgba(128,128,128,.5)';c.fillRect(k*25+2,48,21,1);}
  c.fillStyle='#888';c.font='8px sans-serif';[0,4,8,12,15].forEach(k=>c.fillText(Math.round(mod.EDGES[k])+'',k*25+2,55));
  if(params.layers!==undefined){const n=params.layers,b=bandsNow(),pts=[];for(let k=0;k<n;k++){const g=params.outer===0?k:n-1-k,cx=params.split===3?(k+0.5)/n:(b[g]+b[g+1])/2/16;pts.push([cx*400,(0.5-((params['g'+(k+1)]|0)-18)/36)*56]);}
   c.strokeStyle='rgba(128,128,128,.6)';c.setLineDash&&c.setLineDash([3,3]);c.beginPath();c.moveTo(0,28);c.lineTo(400,28);c.stroke();c.setLineDash&&c.setLineDash([]);
   c.strokeStyle='#fff';c.lineWidth=1.5;c.beginPath();pts.forEach((q,i)=>{if(i)c.lineTo(q[0],q[1]);else c.moveTo(Math.min(0,q[0]),q[1]);});if(pts.length)c.lineTo(400,pts[pts.length-1][1]);c.stroke();c.lineWidth=1;}
  layoutHandles(col);layoutBeads(col);
  $('splitnote').textContent=(handlesOn()?'drag a handle to move a boundary (switches Layer split to CUSTOM) · double-click the strip to add a layer, a handle to remove it · ':'')+'bands = hardware spectrum bank, bass left, coloured by the layer each feeds first · '+d.map(x=>x.spectrum?('layer '+(x.layer+1)+': full spectrum (x axis = frequency), own response time'):x.dynamics?('layer '+(x.layer+1)+': broadband peak, own time constant'):('layer '+(x.layer+1)+': '+x.hzLo+'–'+x.hzHi+' Hz')).join(' · ');}
 /* What each option costs: run the meter headless for a few dozen frames of the demo source with the current settings and one setting changed, and
    report the model CPU range and the SDRAM word operations of the drawing engine (fill 1 per pixel, blend 3, copy 2). Model numbers, demo audio. */
 const estCache=new Map();
 function estimate(pp){
  const k=key+JSON.stringify(pp)+box.w+'x'+box.h+$('theme').value+$('mode').value+$('accent').value;if(estCache.has(k))return estCache.get(k);
  const th=TauTheme.makeTheme(D,+$('theme').value,$('mode').value==='1',+$('accent').value,360),f=new TauFb.Fb(400,360),s=mod.state(),lv=TauBallistics.newSpec(),src=TauAudio.demo(1),N=45,W0=15;
  let cmds=0,work=0,ops=0;
  for(let n=0;n<N;n++){const fr=src(n);TauBallistics.specStep(lv,fr.spec);const c0=f.cmds,o0=f.ops;
   mod.tick({fb:f,x:box.x,y:box.y,w:box.w,h:box.h,bg:0,theme:th,spec:lv,wave:fr.wave,paused:false,p:pp,st:s,force:n===0});
   if(n>=W0){cmds+=f.cmds-c0;work+=s.work||0;ops+=f.ops-o0;}}
  const m=N-W0,r={cmds:cmds/m,ops:ops/m,cpu:TauCost.cpu(cmds/m,work/m)};estCache.set(k,r);return r;
 }
 const mid=c=>(c.low+c.high)/2,sgn=v=>(v>=0?'+':'')+v.toFixed(1);
 function optionNote(pk,i){if(!mod||!mod.state)return'';const base=estimate(params),alt=estimate(Object.assign({},params,{[pk]:i}));
  const d=mid(alt.cpu)-mid(base.cpu),de=base.ops?(alt.ops/base.ops-1)*100:0;
  return 'CPU '+alt.cpu.low+'–'+alt.cpu.high+'% ('+sgn(d)+'), engine '+Math.round(alt.ops/1000)+'k ops/frame ('+(de>=0?'+':'')+Math.round(de)+'%)';}
 let infoTimer=0;function infoSoon(){clearTimeout(infoTimer);infoTimer=setTimeout(()=>{if(!mod||!mod.state)return;if($('infod').open)costTable();if(listening)postInfo();},500);}
 function postInfo(){if(!mod||!mod.state||!lastInfo)return;send({type:'tau-lab-info',meter:meterId(),cost:lastInfo,table:costRows()});}
 function costRows(){const m=S.meters.find(x=>x.key===key),rows=[],base=estimate(params);       /* what each cost-relevant option would cost: the data of the Info table */
  for(const x of m.params){if(x.type!=='enum'||!COST_KEYS.has(x.key)||(x.when&&!Object.entries(x.when).every(([k,v])=>params[k]===v)))continue;
   rows.push({key:x.key,label:x.label,options:x.values.map((v,i)=>{const alt=estimate(Object.assign({},params,{[x.key]:i})),d=mid(alt.cpu)-mid(base.cpu);
    return {value:v,selected:i===params[x.key],cpu_low:alt.cpu.low,cpu_high:alt.cpu.high,delta:Math.round(d*10)/10,kops:Math.round(alt.ops/1000)};})});}
  return rows;}
 function costTable(){const rows=costRows().map(r=>'<tr><th>'+r.label+'</th>'+r.options.map(o=>'<td'+(o.selected?' class="sel"':'')+'>'+o.value+'<br>'+o.cpu_low+'–'+o.cpu_high+'% <small>('+sgn(o.delta)+')</small><br><small>'+o.kops+'k ops</small></td>').join('')+'</tr>');
  $('costtable').innerHTML=rows.length?'<table>'+rows.join('')+'</table><div class="cost">Each cell: model CPU range of one core (change vs your current setting) and SDRAM word operations of the drawing engine per frame, demo audio, current other settings.</div>':'';}
 $('infod').addEventListener('toggle',()=>{if($('infod').open)costTable();});
 rebuild();   // after everything it uses is defined
 setInterval(step,26);
})();
